<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Clients, Business Name</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../assets/styles.css?v=3" rel="stylesheet">
<link href="assets/app.css?v=4" rel="stylesheet">
</head>
<body class="app-body">

  <div class="grain" aria-hidden="true"></div>

  <header class="app-header">
    <div class="app-header-inner">
      <span class="brand">Business Name</span>
      <nav class="app-nav">
        <a href="index.html">Dashboard</a>
        <a href="clients.html" class="active">Clients</a>
        <a href="leads.html">Leads</a>
        <a href="jobs.html">Jobs</a>
        <a href="estimates.html">Estimates</a>
        <a href="invoices.html">Invoices</a>
        <a href="recurring.html">Recurring</a>
      </nav>
      <div class="app-header-actions">
        <span class="user-email mono" id="user-email"></span>
        <button class="btn btn-secondary" id="logout-btn">Log out</button>
      </div>
    </div>
  </header>

  <main class="app-main">
    <div class="page-head">
      <div>
        <span class="eyebrow">Clients</span>
        <h1>Clients</h1>
        <p class="count" id="client-count"></p>
      </div>
      <button class="btn btn-primary notch" id="add-client-btn">Add client</button>
    </div>

    <div id="client-list-wrap">
      <p class="count">Loading…</p>
    </div>
  </main>

  <!-- Add / edit modal -->
  <div class="modal-overlay" id="client-modal-overlay">
    <div class="modal notch">
      <h2 id="client-modal-title">Add client</h2>
      <form id="client-form" novalidate>
        <input type="hidden" id="client-id">
        <div class="form-field">
          <label for="client-name">Name</label>
          <input type="text" id="client-name" required>
        </div>
        <div class="form-field">
          <label for="client-phone">Phone</label>
          <input type="tel" id="client-phone">
        </div>
        <div class="form-field">
          <label for="client-email">Email</label>
          <input type="email" id="client-email">
        </div>
        <div class="form-field">
          <label for="client-address">Address</label>
          <input type="text" id="client-address">
        </div>
        <div class="form-field">
          <label for="client-notes">Notes</label>
          <textarea id="client-notes"></textarea>
        </div>
        <p class="modal-error" id="client-form-error" role="alert"></p>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Save client</button>
          <button type="button" class="btn btn-secondary" id="client-cancel-btn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/supabase-client.js?v=1"></script>
  <script src="assets/auth-guard.js?v=1"></script>
  <script>
    const listWrap = document.getElementById('client-list-wrap');
    const countEl = document.getElementById('client-count');
    const overlay = document.getElementById('client-modal-overlay');
    const modalTitle = document.getElementById('client-modal-title');
    const form = document.getElementById('client-form');
    const formError = document.getElementById('client-form-error');

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    function openModal(client) {
      formError.textContent = '';
      form.reset();
      if (client) {
        modalTitle.textContent = 'Edit client';
        document.getElementById('client-id').value = client.id;
        document.getElementById('client-name').value = client.name || '';
        document.getElementById('client-phone').value = client.phone || '';
        document.getElementById('client-email').value = client.email || '';
        document.getElementById('client-address').value = client.address || '';
        document.getElementById('client-notes').value = client.notes || '';
      } else {
        modalTitle.textContent = 'Add client';
        document.getElementById('client-id').value = '';
      }
      overlay.classList.add('open');
      document.getElementById('client-name').focus();
    }

    function closeModal() {
      overlay.classList.remove('open');
    }

    document.getElementById('add-client-btn').addEventListener('click', () => openModal(null));
    document.getElementById('client-cancel-btn').addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

    async function loadClients() {
      const { data, error } = await supabaseClient
        .from('clients')
        .select('*')
        .order('name', { ascending: true });

      if (error) {
        listWrap.innerHTML = `<p class="count">Couldn't load clients: ${escapeHtml(error.message)}</p>`;
        return;
      }

      countEl.textContent = data.length === 1 ? '1 client' : `${data.length} clients`;

      if (data.length === 0) {
        listWrap.innerHTML = `<div class="empty-state">No clients yet. Add your first one to get started.</div>`;
        return;
      }

      const rows = data.map((c) => `
        <tr>
          <td data-label="Name">${escapeHtml(c.name)}</td>
          <td data-label="Phone" class="muted">${escapeHtml(c.phone) || '—'}</td>
          <td data-label="Email" class="muted">${escapeHtml(c.email) || '—'}</td>
          <td data-label="Address" class="muted">${escapeHtml(c.address) || '—'}</td>
          <td data-label="Actions">
            <div class="row-actions">
              <button type="button" data-edit="${c.id}">Edit</button>
              <button type="button" class="danger" data-delete="${c.id}">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');

      listWrap.innerHTML = `
        <table class="data-table">
          <thead>
            <tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th>Actions</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;

      listWrap.querySelectorAll('[data-edit]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const client = data.find((c) => c.id === btn.dataset.edit);
          openModal(client);
        });
      });
      listWrap.querySelectorAll('[data-delete]').forEach((btn) => {
        btn.addEventListener('click', () => deleteClient(btn.dataset.delete));
      });
    }

    async function deleteClient(id) {
      if (!confirm('Delete this client? This cannot be undone.')) return;
      const { error } = await supabaseClient.from('clients').delete().eq('id', id);
      if (error) {
        if (error.message.includes('violates foreign key')) {
          alert("Can't delete this client — they still have jobs on file. Remove or reassign those first.");
        } else {
          alert('Something went wrong: ' + error.message);
        }
        return;
      }
      loadClients();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      formError.textContent = '';

      const id = document.getElementById('client-id').value;
      const payload = {
        name: document.getElementById('client-name').value.trim(),
        phone: document.getElementById('client-phone').value.trim() || null,
        email: document.getElementById('client-email').value.trim() || null,
        address: document.getElementById('client-address').value.trim() || null,
        notes: document.getElementById('client-notes').value.trim() || null,
      };

      if (!payload.name) {
        formError.textContent = 'Name is required.';
        return;
      }

      const query = id
        ? supabaseClient.from('clients').update(payload).eq('id', id)
        : supabaseClient.from('clients').insert(payload);

      const { error } = await query;
      if (error) {
        formError.textContent = error.message;
        return;
      }

      closeModal();
      loadClients();
    });

    loadClients();

    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) document.getElementById('user-email').textContent = session.user.email;
    });
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    });
  </script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Jobs, Business Name</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../assets/styles.css?v=4" rel="stylesheet">
<link href="assets/app.css?v=5" rel="stylesheet">
</head>
<body class="app-body">

  <div class="grain" aria-hidden="true"></div>

  <header class="app-header">
    <div class="app-header-inner">
      <span class="brand">Business Name</span>
      <nav class="app-nav">
        <a href="index.html">Dashboard</a>
        <a href="clients.html">Clients</a>
        <a href="leads.html">Leads</a>
        <a href="jobs.html" class="active">Jobs</a>
        <a href="estimates.html">Estimates</a>
        <a href="invoices.html">Invoices</a>
        <a href="recurring.html">Recurring</a>
      </nav>
      <div class="app-header-actions">
        <span class="user-email mono" id="user-email"></span>
        <button class="btn btn-secondary" id="logout-btn">Log out</button>
        <button class="menu-toggle notch" id="menu-toggle" aria-expanded="false" aria-controls="mobile-nav" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <nav class="mobile-nav" id="mobile-nav" aria-hidden="true">
      <a href="index.html">Dashboard</a>
      <a href="clients.html">Clients</a>
      <a href="leads.html">Leads</a>
      <a href="jobs.html">Jobs</a>
      <a href="estimates.html">Estimates</a>
      <a href="invoices.html">Invoices</a>
      <a href="recurring.html">Recurring</a>
    </nav>
  </header>

  <main class="app-main">
    <div class="page-head">
      <div>
        <span class="eyebrow">Jobs</span>
        <h1>Jobs</h1>
        <p class="count" id="job-count"></p>
      </div>
      <button class="btn btn-primary notch" id="add-job-btn">Add job</button>
    </div>

    <div id="job-list-wrap">
      <p class="count">Loading…</p>
    </div>
  </main>

  <!-- Add / edit modal -->
  <div class="modal-overlay" id="job-modal-overlay">
    <div class="modal notch">
      <h2 id="job-modal-title">Add job</h2>
      <form id="job-form" novalidate>
        <input type="hidden" id="job-id">
        <div class="form-field">
          <label for="job-client">Client</label>
          <select id="job-client" required></select>
        </div>
        <div class="form-field">
          <label for="job-service">Service</label>
          <input type="text" id="job-service" placeholder="e.g. Water extraction + drying" required>
        </div>
        <div class="form-field">
          <label for="job-status">Status</label>
          <select id="job-status">
            <option value="new">New</option>
            <option value="in_progress">In progress</option>
            <option value="drying">Drying</option>
            <option value="complete">Complete</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div class="form-field">
          <label for="job-address">Job address</label>
          <input type="text" id="job-address">
        </div>
        <div class="form-field">
          <label for="job-assigned">Assigned to</label>
          <select id="job-assigned">
            <option value="">Unassigned</option>
          </select>
        </div>
        <div class="form-field">
          <label for="job-date">Scheduled date</label>
          <input type="date" id="job-date">
        </div>
        <div class="form-field">
          <label for="job-notes">Notes</label>
          <textarea id="job-notes"></textarea>
        </div>
        <p class="modal-error" id="job-form-error" role="alert"></p>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Save job</button>
          <button type="button" class="btn btn-secondary" id="job-cancel-btn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Documents modal -->
  <div class="modal-overlay" id="docs-modal-overlay">
    <div class="modal notch">
      <h2 id="docs-modal-title">Documents</h2>
      <div id="docs-list"></div>
      <form id="docs-upload-form" novalidate style="margin-top: var(--space-3); border-top: 1px solid var(--line); padding-top: var(--space-3);">
        <input type="hidden" id="docs-job-id">
        <div class="form-field">
          <label for="docs-file">File</label>
          <input type="file" id="docs-file" required>
        </div>
        <div class="form-field">
          <label for="docs-type">Type</label>
          <select id="docs-type">
            <option value="photo">Photo</option>
            <option value="moisture_reading">Moisture reading</option>
            <option value="insurance">Insurance paperwork</option>
            <option value="other">Other</option>
          </select>
        </div>
        <p class="modal-error" id="docs-form-error" role="alert"></p>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary" id="docs-upload-btn">Upload</button>
          <button type="button" class="btn btn-secondary" id="docs-close-btn">Close</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/supabase-client.js?v=1"></script>
  <script src="assets/auth-guard.js?v=1"></script>
  <script src="../assets/site.js?v=2"></script>
  <script>
    const listWrap = document.getElementById('job-list-wrap');
    const countEl = document.getElementById('job-count');
    const overlay = document.getElementById('job-modal-overlay');
    const modalTitle = document.getElementById('job-modal-title');
    const form = document.getElementById('job-form');
    const formError = document.getElementById('job-form-error');
    const clientSelect = document.getElementById('job-client');
    const assignedSelect = document.getElementById('job-assigned');

    const docsOverlay = document.getElementById('docs-modal-overlay');
    const docsUploadForm = document.getElementById('docs-upload-form');
    const docsFormError = document.getElementById('docs-form-error');

    let jobsCache = [];
    let currentUserId = null;
    let currentDocsJobId = null;

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    const STATUS_LABEL = {
      new: 'New', in_progress: 'In progress', drying: 'Drying',
      complete: 'Complete', cancelled: 'Cancelled',
    };

    async function populateDropdowns(selectedClientId, selectedAssignedId) {
      const [{ data: clients }, { data: profiles }] = await Promise.all([
        supabaseClient.from('clients').select('id, name').order('name'),
        supabaseClient.from('profiles').select('id, full_name').order('full_name'),
      ]);

      clientSelect.innerHTML = (clients || [])
        .map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`)
        .join('');
      if (selectedClientId) clientSelect.value = selectedClientId;

      assignedSelect.innerHTML = '<option value="">Unassigned</option>' + (profiles || [])
        .map((p) => `<option value="${p.id}">${escapeHtml(p.full_name)}</option>`)
        .join('');
      assignedSelect.value = selectedAssignedId || '';
    }

    async function openModal(job) {
      formError.textContent = '';
      form.reset();
      await populateDropdowns(job?.client_id, job?.assigned_to);

      if (job) {
        modalTitle.textContent = 'Edit job';
        document.getElementById('job-id').value = job.id;
        document.getElementById('job-service').value = job.service_summary || '';
        document.getElementById('job-status').value = job.status || 'new';
        document.getElementById('job-address').value = job.address || '';
        document.getElementById('job-date').value = job.scheduled_date || '';
        document.getElementById('job-notes').value = job.notes || '';
      } else {
        modalTitle.textContent = 'Add job';
        document.getElementById('job-id').value = '';
        document.getElementById('job-status').value = 'new';
      }
      overlay.classList.add('open');
    }

    function closeModal() { overlay.classList.remove('open'); }

    document.getElementById('add-job-btn').addEventListener('click', () => openModal(null));
    document.getElementById('job-cancel-btn').addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

    async function loadJobs() {
      const { data, error } = await supabaseClient
        .from('jobs')
        .select('*, clients(name), profiles(full_name)')
        .order('scheduled_date', { ascending: true, nullsFirst: false });

      if (error) {
        listWrap.innerHTML = `<p class="count">Couldn't load jobs: ${escapeHtml(error.message)}</p>`;
        return;
      }
      jobsCache = data;

      countEl.textContent = data.length === 1 ? '1 job' : `${data.length} jobs`;

      if (data.length === 0) {
        listWrap.innerHTML = `<div class="empty-state">No jobs yet. Add one, or convert a lead into a client and then a job.</div>`;
        return;
      }

      const rows = data.map((j) => `
        <tr>
          <td data-label="Client">${escapeHtml(j.clients?.name) || '—'}</td>
          <td data-label="Service">${escapeHtml(j.service_summary)}</td>
          <td data-label="Status"><span class="status-badge status-${j.status}">${STATUS_LABEL[j.status] || j.status}</span></td>
          <td data-label="Scheduled" class="muted">${j.scheduled_date ? new Date(j.scheduled_date + 'T00:00:00').toLocaleDateString() : '—'}</td>
          <td data-label="Assigned to" class="muted">${escapeHtml(j.profiles?.full_name) || 'Unassigned'}</td>
          <td data-label="Actions">
            <div class="row-actions">
              <button type="button" data-edit="${j.id}">Edit</button>
              <button type="button" data-docs="${j.id}">Documents</button>
              <button type="button" class="danger" data-delete="${j.id}">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');

      listWrap.innerHTML = `
        <table class="data-table">
          <thead>
            <tr><th>Client</th><th>Service</th><th>Status</th><th>Scheduled</th><th>Assigned to</th><th>Actions</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;

      listWrap.querySelectorAll('[data-edit]').forEach((btn) => {
        btn.addEventListener('click', () => openModal(data.find((j) => j.id === btn.dataset.edit)));
      });
      listWrap.querySelectorAll('[data-delete]').forEach((btn) => {
        btn.addEventListener('click', () => deleteJob(btn.dataset.delete));
      });
      listWrap.querySelectorAll('[data-docs]').forEach((btn) => {
        btn.addEventListener('click', () => openDocsModal(jobsCache.find((j) => j.id === btn.dataset.docs)));
      });
    }

    // ---------- documents ----------
    async function openDocsModal(job) {
      currentDocsJobId = job.id;
      document.getElementById('docs-job-id').value = job.id;
      document.getElementById('docs-modal-title').textContent = `Documents — ${job.clients?.name || 'job'}`;
      docsFormError.textContent = '';
      docsUploadForm.reset();
      await refreshDocs(job.id);
      docsOverlay.classList.add('open');
    }

    async function refreshDocs(jobId) {
      const listEl = document.getElementById('docs-list');
      const { data: docs, error } = await supabaseClient
        .from('documents')
        .select('*, profiles(full_name)')
        .eq('job_id', jobId)
        .order('created_at', { ascending: false });

      if (error) {
        listEl.innerHTML = `<p class="count">Couldn't load documents: ${escapeHtml(error.message)}</p>`;
        return;
      }
      if (!docs.length) {
        listEl.innerHTML = '<p class="count">No documents uploaded yet.</p>';
        return;
      }

      listEl.innerHTML = docs.map((d) => {
        const filename = d.file_path.split('/').pop();
        return `
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--space-2);padding:0.4rem 0;border-bottom:1px solid var(--line);font-size:0.9rem;">
          <span>${escapeHtml(filename)} <span class="muted">(${escapeHtml(d.file_type)})</span></span>
          <span class="row-actions">
            <button type="button" data-view="${d.id}" data-path="${escapeHtml(d.file_path)}">View</button>
            <button type="button" class="danger" data-del-doc="${d.id}" data-path="${escapeHtml(d.file_path)}">Delete</button>
          </span>
        </div>
      `;
      }).join('');

      listEl.querySelectorAll('[data-view]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const { data, error } = await supabaseClient.storage
            .from('job-documents').createSignedUrl(btn.dataset.path, 60);
          if (error) { alert('Could not open file: ' + error.message); return; }
          window.open(data.signedUrl, '_blank');
        });
      });
      listEl.querySelectorAll('[data-del-doc]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this document?')) return;
          await supabaseClient.storage.from('job-documents').remove([btn.dataset.path]);
          await supabaseClient.from('documents').delete().eq('id', btn.dataset.delDoc);
          refreshDocs(currentDocsJobId);
        });
      });
    }

    document.getElementById('docs-close-btn').addEventListener('click', () => docsOverlay.classList.remove('open'));
    docsOverlay.addEventListener('click', (e) => { if (e.target === docsOverlay) docsOverlay.classList.remove('open'); });

    docsUploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      docsFormError.textContent = '';

      const fileInput = document.getElementById('docs-file');
      const file = fileInput.files[0];
      if (!file) { docsFormError.textContent = 'Choose a file first.'; return; }

      const uploadBtn = document.getElementById('docs-upload-btn');
      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Uploading…';

      const path = `${currentDocsJobId}/${Date.now()}-${file.name}`;
      const { error: uploadError } = await supabaseClient.storage
        .from('job-documents').upload(path, file);

      if (uploadError) {
        docsFormError.textContent = uploadError.message.includes('Bucket not found')
          ? 'File storage isn’t set up yet — run supabase/storage-setup.sql first.'
          : uploadError.message;
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Upload';
        return;
      }

      const { error: rowError } = await supabaseClient.from('documents').insert({
        job_id: currentDocsJobId,
        file_path: path,
        file_type: document.getElementById('docs-type').value,
        uploaded_by: currentUserId,
      });

      uploadBtn.disabled = false;
      uploadBtn.textContent = 'Upload';

      if (rowError) {
        docsFormError.textContent = rowError.message;
        return;
      }

      docsUploadForm.reset();
      refreshDocs(currentDocsJobId);
    });

    async function deleteJob(id) {
      if (!confirm('Delete this job? This cannot be undone.')) return;
      const { error } = await supabaseClient.from('jobs').delete().eq('id', id);
      if (error) {
        if (error.message.includes('violates foreign key')) {
          alert("Can't delete this job — it still has invoices or documents on file.");
        } else {
          alert('Something went wrong: ' + error.message);
        }
        return;
      }
      loadJobs();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      formError.textContent = '';

      const id = document.getElementById('job-id').value;
      const payload = {
        client_id: clientSelect.value || null,
        service_summary: document.getElementById('job-service').value.trim(),
        status: document.getElementById('job-status').value,
        address: document.getElementById('job-address').value.trim() || null,
        assigned_to: assignedSelect.value || null,
        scheduled_date: document.getElementById('job-date').value || null,
        notes: document.getElementById('job-notes').value.trim() || null,
      };

      if (!payload.client_id) {
        formError.textContent = 'Pick a client — add one on the Clients page first if needed.';
        return;
      }
      if (!payload.service_summary) {
        formError.textContent = 'Service is required.';
        return;
      }

      const query = id
        ? supabaseClient.from('jobs').update(payload).eq('id', id)
        : supabaseClient.from('jobs').insert(payload);

      const { error } = await query;
      if (error) {
        formError.textContent = error.message;
        return;
      }

      closeModal();
      loadJobs();
    });

    loadJobs();

    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        document.getElementById('user-email').textContent = session.user.email;
        currentUserId = session.user.id;
      }
    });
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    });
  </script>

</body>
</html>

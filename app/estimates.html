<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Estimates, Business Name</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../assets/styles.css?v=7" rel="stylesheet">
<link href="assets/app.css?v=7" rel="stylesheet">
</head>
<body class="app-body">

  <div class="grain" aria-hidden="true"></div>

  <header class="app-header">
    <div class="app-header-inner">
      <span class="brand">Business Name</span>
      <nav class="app-nav">
        <a href="index.html">Dashboard</a>
        <a href="clients.html">Clients</a>
        <a href="leads.html">Leads</a>
        <a href="jobs.html">Jobs</a>
        <a href="estimates.html" class="active">Estimates</a>
        <a href="invoices.html">Invoices</a>
        <a href="recurring.html">Recurring</a>
      </nav>
      <div class="app-header-actions">
        <span class="user-email mono" id="user-email"></span>
        <button class="btn btn-secondary" id="logout-btn">Log out</button>
        <button class="menu-toggle notch" id="menu-toggle" aria-expanded="false" aria-controls="mobile-nav" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <nav class="mobile-nav" id="mobile-nav" aria-hidden="true">
      <a href="index.html">Dashboard</a>
      <a href="clients.html">Clients</a>
      <a href="leads.html">Leads</a>
      <a href="jobs.html">Jobs</a>
      <a href="estimates.html">Estimates</a>
      <a href="invoices.html">Invoices</a>
      <a href="recurring.html">Recurring</a>
    </nav>
  </header>

  <main class="app-main">
    <div class="page-head">
      <div>
        <span class="eyebrow">Estimates</span>
        <h1>Estimates</h1>
        <p class="count" id="estimate-count"></p>
      </div>
      <button class="btn btn-primary notch" id="add-estimate-btn">Add estimate</button>
    </div>

    <div id="estimate-list-wrap">
      <p class="count">Loading…</p>
    </div>
  </main>

  <!-- Add / edit modal -->
  <div class="modal-overlay" id="estimate-modal-overlay">
    <div class="modal modal-wide notch">
      <h2 id="estimate-modal-title">Add estimate</h2>
      <form id="estimate-form" novalidate>
        <input type="hidden" id="estimate-id">
        <div class="form-field">
          <label for="estimate-client">Client</label>
          <select id="estimate-client" required></select>
        </div>
        <div class="form-field">
          <label for="estimate-status">Status</label>
          <select id="estimate-status">
            <option value="draft">Draft</option>
            <option value="sent">Sent</option>
            <option value="approved">Approved</option>
            <option value="declined">Declined</option>
          </select>
        </div>
        <div class="form-field">
          <label for="estimate-expires">Expires on</label>
          <input type="date" id="estimate-expires">
        </div>

        <div class="line-items">
          <table>
            <thead>
              <tr><th style="width:22%">Service</th><th>Description</th><th style="width:72px">Qty</th><th style="width:90px">Price</th><th></th></tr>
            </thead>
            <tbody id="estimate-line-items"></tbody>
          </table>
          <button type="button" class="btn btn-secondary" id="add-line-btn" style="margin-top: var(--space-2);">+ Add line</button>
          <p class="line-items-total">Total: <strong id="estimate-total">$0.00</strong></p>
        </div>

        <div class="form-field">
          <label for="estimate-notes">Notes</label>
          <textarea id="estimate-notes"></textarea>
        </div>
        <p class="modal-error" id="estimate-form-error" role="alert"></p>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Save estimate</button>
          <button type="button" class="btn btn-secondary" id="estimate-cancel-btn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/supabase-client.js?v=1"></script>
  <script src="assets/auth-guard.js?v=1"></script>
  <script src="../assets/site.js?v=2"></script>
  <script>
    const listWrap = document.getElementById('estimate-list-wrap');
    const countEl = document.getElementById('estimate-count');
    const overlay = document.getElementById('estimate-modal-overlay');
    const modalTitle = document.getElementById('estimate-modal-title');
    const form = document.getElementById('estimate-form');
    const formError = document.getElementById('estimate-form-error');
    const clientSelect = document.getElementById('estimate-client');
    const lineItemsBody = document.getElementById('estimate-line-items');
    const totalEl = document.getElementById('estimate-total');

    let servicesCache = [];
    let currentEstimateId = null;

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }
    function money(n) { return '$' + (Number(n) || 0).toFixed(2); }

    const STATUS_LABEL = { draft: 'Draft', sent: 'Sent', approved: 'Approved', declined: 'Declined' };

    function updateTotal() {
      let total = 0;
      lineItemsBody.querySelectorAll('.line-item-row').forEach((row) => {
        const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
        const price = parseFloat(row.querySelector('.item-price').value) || 0;
        total += qty * price;
      });
      totalEl.textContent = money(total);
      return total;
    }

    function addLineRow(item) {
      const row = document.createElement('tr');
      row.className = 'line-item-row';
      row.innerHTML = `
        <td>
          <select class="item-service">
            <option value="">Custom</option>
            ${servicesCache.map((s) => `<option value="${s.id}" data-price="${s.default_price}" data-name="${escapeHtml(s.name)}">${escapeHtml(s.name)}</option>`).join('')}
          </select>
        </td>
        <td><input type="text" class="item-desc" placeholder="Description" value="${escapeHtml(item?.description || '')}"></td>
        <td><input type="number" class="item-qty qty-input" min="0" step="0.5" value="${item?.quantity ?? 1}"></td>
        <td><input type="number" class="item-price price-input" min="0" step="0.01" value="${item?.unit_price ?? ''}"></td>
        <td><button type="button" class="remove-line" aria-label="Remove line">&times;</button></td>
      `;
      if (item?.service_id) row.querySelector('.item-service').value = item.service_id;

      row.querySelector('.item-service').addEventListener('change', (e) => {
        const opt = e.target.selectedOptions[0];
        if (opt.value) {
          row.querySelector('.item-desc').value = opt.dataset.name;
          row.querySelector('.item-price').value = opt.dataset.price;
          updateTotal();
        }
      });
      row.querySelectorAll('.item-qty, .item-price').forEach((el) => el.addEventListener('input', updateTotal));
      row.querySelector('.remove-line').addEventListener('click', () => { row.remove(); updateTotal(); });

      lineItemsBody.appendChild(row);
    }

    document.getElementById('add-line-btn').addEventListener('click', () => addLineRow(null));

    async function ensureServicesLoaded() {
      if (servicesCache.length) return;
      const { data } = await supabaseClient.from('services').select('*').order('name');
      servicesCache = data || [];
    }

    async function populateClientDropdown(selectedId) {
      const { data } = await supabaseClient.from('clients').select('id, name').order('name');
      clientSelect.innerHTML = (data || []).map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
      if (selectedId) clientSelect.value = selectedId;
    }

    async function openModal(estimate) {
      formError.textContent = '';
      form.reset();
      lineItemsBody.innerHTML = '';
      currentEstimateId = estimate?.id || null;

      await ensureServicesLoaded();
      await populateClientDropdown(estimate?.client_id);

      if (estimate) {
        modalTitle.textContent = 'Edit estimate';
        document.getElementById('estimate-id').value = estimate.id;
        document.getElementById('estimate-status').value = estimate.status || 'draft';
        document.getElementById('estimate-expires').value = estimate.expires_on || '';
        document.getElementById('estimate-notes').value = estimate.notes || '';

        const { data: items } = await supabaseClient
          .from('estimate_items').select('*').eq('estimate_id', estimate.id);
        (items && items.length ? items : [null]).forEach((item) => item && addLineRow(item));
        if (!items || !items.length) addLineRow(null);
      } else {
        modalTitle.textContent = 'Add estimate';
        document.getElementById('estimate-id').value = '';
        document.getElementById('estimate-status').value = 'draft';
        addLineRow(null);
      }
      updateTotal();
      overlay.classList.add('open');
    }

    function closeModal() { overlay.classList.remove('open'); }

    document.getElementById('add-estimate-btn').addEventListener('click', () => openModal(null));
    document.getElementById('estimate-cancel-btn').addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

    async function loadEstimates() {
      const { data, error } = await supabaseClient
        .from('estimates')
        .select('*, clients(name), estimate_items(quantity, unit_price)')
        .order('created_at', { ascending: false });

      if (error) {
        listWrap.innerHTML = `<p class="count">Couldn't load estimates: ${escapeHtml(error.message)}</p>`;
        return;
      }

      countEl.textContent = data.length === 1 ? '1 estimate' : `${data.length} estimates`;

      if (data.length === 0) {
        listWrap.innerHTML = `<div class="empty-state">No estimates yet. Add one to send to a client.</div>`;
        return;
      }

      const rows = data.map((est) => {
        const total = (est.estimate_items || []).reduce((sum, i) => sum + (i.quantity * i.unit_price), 0);
        return `
        <tr>
          <td data-label="Client">${escapeHtml(est.clients?.name) || '—'}</td>
          <td data-label="Status"><span class="status-badge status-${est.status}">${STATUS_LABEL[est.status] || est.status}</span></td>
          <td data-label="Total" class="mono">${money(total)}</td>
          <td data-label="Expires" class="muted">${est.expires_on ? new Date(est.expires_on + 'T00:00:00').toLocaleDateString() : '—'}</td>
          <td data-label="Actions">
            <div class="row-actions">
              <button type="button" data-edit="${est.id}">Edit</button>
              <button type="button" data-tojob="${est.id}">Create job</button>
              <button type="button" class="danger" data-delete="${est.id}">Delete</button>
            </div>
          </td>
        </tr>
      `;
      }).join('');

      listWrap.innerHTML = `
        <table class="data-table">
          <thead><tr><th>Client</th><th>Status</th><th>Total</th><th>Expires</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;

      listWrap.querySelectorAll('[data-edit]').forEach((btn) => {
        btn.addEventListener('click', () => openModal(data.find((e) => e.id === btn.dataset.edit)));
      });
      listWrap.querySelectorAll('[data-delete]').forEach((btn) => {
        btn.addEventListener('click', () => deleteEstimate(btn.dataset.delete));
      });
      listWrap.querySelectorAll('[data-tojob]').forEach((btn) => {
        btn.addEventListener('click', () => createJobFromEstimate(data.find((e) => e.id === btn.dataset.tojob)));
      });
    }

    async function createJobFromEstimate(estimate) {
      if (!confirm(`Create a job for ${estimate.clients?.name || 'this client'} from this estimate?`)) return;
      const summary = (estimate.estimate_items || []).length
        ? 'From estimate'
        : 'From estimate';
      const { error } = await supabaseClient.from('jobs').insert({
        client_id: estimate.client_id,
        estimate_id: estimate.id,
        service_summary: summary,
        status: 'new',
      });
      if (error) {
        alert('Could not create job: ' + error.message);
        return;
      }
      alert('Job created — open the Jobs page to set a schedule and assign it.');
    }

    async function deleteEstimate(id) {
      if (!confirm('Delete this estimate? This cannot be undone.')) return;
      const { error } = await supabaseClient.from('estimates').delete().eq('id', id);
      if (error) {
        alert('Something went wrong: ' + error.message);
        return;
      }
      loadEstimates();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      formError.textContent = '';

      const clientId = clientSelect.value;
      if (!clientId) {
        formError.textContent = 'Pick a client — add one on the Clients page first if needed.';
        return;
      }

      const items = [...lineItemsBody.querySelectorAll('.line-item-row')].map((row) => ({
        service_id: row.querySelector('.item-service').value || null,
        description: row.querySelector('.item-desc').value.trim(),
        quantity: parseFloat(row.querySelector('.item-qty').value) || 0,
        unit_price: parseFloat(row.querySelector('.item-price').value) || 0,
      })).filter((i) => i.description);

      if (items.length === 0) {
        formError.textContent = 'Add at least one line item.';
        return;
      }

      const payload = {
        client_id: clientId,
        status: document.getElementById('estimate-status').value,
        expires_on: document.getElementById('estimate-expires').value || null,
        notes: document.getElementById('estimate-notes').value.trim() || null,
      };

      let estimateId = currentEstimateId;
      if (estimateId) {
        const { error } = await supabaseClient.from('estimates').update(payload).eq('id', estimateId);
        if (error) { formError.textContent = error.message; return; }
        await supabaseClient.from('estimate_items').delete().eq('estimate_id', estimateId);
      } else {
        const { data, error } = await supabaseClient.from('estimates').insert(payload).select().single();
        if (error) { formError.textContent = error.message; return; }
        estimateId = data.id;
      }

      const { error: itemsError } = await supabaseClient
        .from('estimate_items')
        .insert(items.map((i) => ({ ...i, estimate_id: estimateId })));

      if (itemsError) {
        formError.textContent = itemsError.message;
        return;
      }

      closeModal();
      loadEstimates();
    });

    loadEstimates();

    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) document.getElementById('user-email').textContent = session.user.email;
    });
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    });
  </script>

</body>
</html>

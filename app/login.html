<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Team login, Business Name</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../assets/styles.css?v=7" rel="stylesheet">
<link href="assets/app.css?v=5" rel="stylesheet">
</head>
<body class="app-body no-guard">

  <div class="grain" aria-hidden="true"></div>

  <main class="auth-screen">
    <div class="auth-card notch">
      <span class="brand">Business Name</span>
      <h1 class="auth-title">Team login</h1>
      <p class="auth-sub">Sign in with the account set up for you.</p>
      <form id="login-form" novalidate>
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">Sign in</button>
        <p class="auth-error" id="login-error" role="alert"></p>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/supabase-client.js?v=1"></script>
  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      submitBtn.disabled = false;

      if (error) {
        errorEl.textContent = 'Email or password is incorrect.';
        return;
      }
      window.location.href = 'index.html';
    });

    // already signed in? skip straight to the app
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'index.html';
    });
  </script>

</body>
</html>
